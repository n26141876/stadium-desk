<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成大體育館櫃檯通道</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 380px; width: 90%; }
    .spinner { width: 24px; height: 24px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-block; padding: 8px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading"><span class="spinner"></span>正在連接櫃檯審計台...</div>
    <div id="error" style="display:none; color:#dc2626;">
      <p>⚠️ 櫃檯通道離線中，請待管理員開啟連線。</p>
      <button class="btn" onclick="window.location.reload()">🔄 重新整理</button>
    </div>
  </div>
  <script>
    const GIST = "https://gist.githubusercontent.com/n26141876/0e0d1d29f25c5aa04db784712b5ec125/raw/?t=" + Date.now();
    fetch(GIST)
      .then(r => r.json())
      .then(d => {
        if (d && d.status === "ACTIVE" && d.url) {
          window.location.replace(d.url.replace(/\/$/, "") + "/audit");
        } else {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
        }
      })
      .catch(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
      });
  </script>
</body>
</html>
